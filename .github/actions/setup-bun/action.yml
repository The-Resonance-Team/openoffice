name: Setup Bun + Node
description: >
  Shared setup for CI jobs: Bun install, dependency install, and Prisma client
  generation. Assumes actions/checkout already ran in the calling job.

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: package.json
    - run: bun install --frozen-lockfile
      shell: bash
    - run: bun run db:generate
      shell: bash
      working-directory: apps/cloud-api
