name: review

on:
  issue_comment:
    types: [created]

jobs:
  review:
    if: |
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/review') &&
      contains(fromJson('["OWNER","MEMBER"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Get PR number
        id: pr-number
        run: echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - name: Install opencode
        run: curl -fsSL https://opencode.ai/install | bash

      - name: Get PR details
        id: pr-details
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api /repos/${{ github.repository }}/pulls/${{ steps.pr-number.outputs.number }} > pr_data.json
          echo "title=$(jq -r .title pr_data.json)" >> "$GITHUB_OUTPUT"
          echo "sha=$(jq -r .head.sha pr_data.json)" >> "$GITHUB_OUTPUT"

      - name: Review PR
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_PERMISSION: '{ "bash": { "*": "deny", "gh*": "allow", "gh pr review*": "deny" } }'
          PR_TITLE: ${{ steps.pr-details.outputs.title }}
        run: |
          PR_BODY=$(jq -r .body pr_data.json)
          opencode run -m opencode/gpt-5.5 "A new pull request has been created: '${PR_TITLE}'

          <pr-number>
          ${{ steps.pr-number.outputs.number }}
          </pr-number>

          <pr-description>
          $PR_BODY
          </pr-description>

          Review all the code changes in this PR against the repository conventions (CONTEXT.md, docs/adr/, src/README.md) and look for bugs. Diffs are important, but read the entire file for proper context. Make it clear the suggestions are merely suggestions and the human can decide what to do.

          Post inline comments with the gh cli on the exact line of each violation. Prefer a plain comment over a suggested change; if you include a suggested fix, make sure it is actually valid TypeScript.

          Comment command MUST be like this:
          \`\`\`
          gh api --method POST -H \"Accept: application/vnd.github+json\" -H \"X-GitHub-Api-Version: 2022-11-28\" /repos/${{ github.repository }}/pulls/${{ steps.pr-number.outputs.number }}/comments -f 'body=[summary of issue]' -f 'commit_id=${{ steps.pr-details.outputs.sha }}' -f 'path=[path-to-file]' -F 'line=[line]' -f 'side=RIGHT'
          \`\`\`

          Only create comments for actual violations. If the code follows all conventions, comment on the PR using gh cli: 'lgtm' AND NOTHING ELSE."
