name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Remote cache (Vercel) turns on once the repo variable TURBO_TEAM and the
  # secret TURBO_TOKEN exist; empty values disable it cleanly (verified
  # against turbo 2.10.8: falls back to local cache, no error).
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  typecheck:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # Turbo's default cache lives in node_modules/.cache, which checkout
      # (clean: true) wipes every run; turbo does not expand `~`/$HOME in env
      # values, so the persistent L1 dir must be set via GITHUB_ENV. Only
      # matters on self-hosted (persistent disk); hosted runners rebuild from
      # the remote cache either way.
      - name: Warm turbo L1 cache
        run: echo "TURBO_CACHE_DIR=$HOME/.cache/turbo" >> "$GITHUB_ENV"
      - run: bun run typecheck

  lint:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Warm turbo L1 cache
        run: echo "TURBO_CACHE_DIR=$HOME/.cache/turbo" >> "$GITHUB_ENV"
      - run: bun run lint
      - run: bun run lint:boundaries

  build-web:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # Self-hosted: HOME persists across runs, so bun's install cache is warm
      # (setup-bun caches the bun binary itself by default; the hosted-runner
      # cache restore/save actions are unnecessary here).
      - run: bun install --frozen-lockfile
      - run: bun run turbo run build --filter=web
        env:
          NEXT_PUBLIC_OPENOFFICE_SERVER_PORT: '9999'

  unit:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Warm turbo L1 cache
        run: echo "TURBO_CACHE_DIR=$HOME/.cache/turbo" >> "$GITHUB_ENV"
      # Through turbo now so tests cache. Full suite incl. cloud-api (jest);
      # Linux-only by choice — no Windows leg (ADR 0029).
      - run: bun run test

  coverage:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # ponytail: stays a bare root run — the aggregate lcov + threshold gate
      # (check-coverage.ts 45) is real behavior turbo's per-package coverage
      # would fragment. Revisit only if the gate moves.
      - run: bun test --timeout=30000 --coverage --coverage-reporter=lcov --path-ignore-patterns=apps/cli/test/e2e --path-ignore-patterns=apps/cloud-api --path-ignore-patterns=apps/cloud-web
      - run: bun run apps/cli/scripts/check-coverage.ts 45

  e2e:
    runs-on: self-hosted
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: openoffice
          POSTGRES_PASSWORD: openoffice
          POSTGRES_DB: openoffice_cloud
        ports:
          - '5253:5432'
        options: >-
          --health-cmd "pg_isready -U openoffice -d openoffice_cloud"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      # ponytail: no cache action for officecli — the self-hosted runner's HOME
      # persists, so ~/.local/bin is already warm across runs; the installer
      # no-ops when present. Add a hash-keyed cache if the runner goes ephemeral.
      - name: Install officecli
        run: |
          curl -fsSL https://d.officecli.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: bun test --timeout=60000 test/e2e/
        working-directory: apps/cli
      # Cloud-api e2e: real AppModule against the Postgres service above
      # (docker-compose-compatible credentials/port, standing Docker rule).
      - name: Migrate cloud-api database
        working-directory: apps/cloud-api
        env:
          DATABASE_URL: postgresql://openoffice:openoffice@127.0.0.1:5253/openoffice_cloud
        run: bunx prisma migrate deploy
      - run: bun run test:e2e --filter=cloud-api
