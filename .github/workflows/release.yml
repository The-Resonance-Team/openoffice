name: release
run-name: 'release ${{ inputs.bump }}'

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        options: [major, minor, patch]
        default: patch

concurrency:
  group: release

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          cache: true
          bun-version-file: package.json
      - run: bun install --frozen-lockfile

      - name: Bump version
        run: |
          NEW_VERSION=$(bun -e 'const p=require("./apps/cli/package.json");const i={major:0,minor:1,patch:2}[process.argv[1]];const v=p.version.split(".").map(Number);v[i]++;for(let j=i+1;j<3;j++)v[j]=0;console.log(v.join("."))' "${{ inputs.bump }}")
          echo "NEW_VERSION=$NEW_VERSION" >> "$GITHUB_ENV"

      # The published version lives in apps/cli/package.json; the workspace
      # root is private and carries no version.
      - name: Update package.json
        run: |
          bun -e 'const fs=require("fs");const f="apps/cli/package.json";const p=JSON.parse(fs.readFileSync(f,"utf8"));p.version=process.env.NEW_VERSION;fs.writeFileSync(f,JSON.stringify(p,null,2)+"\n")'

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/cli/package.json bun.lock
          git commit -m "v$NEW_VERSION"
          git tag "v$NEW_VERSION"
          git push
          git push origin "v$NEW_VERSION"

      # Tag pushes made with GITHUB_TOKEN never trigger other workflows, so
      # build.yml cannot rely on `push: tags` here. workflow_dispatch is the
      # documented exception that always creates a run — invoke it explicitly.
      - name: Dispatch build.yml
        run: gh workflow run build.yml --ref "v$NEW_VERSION" -f version="v$NEW_VERSION"
        env:
          GH_TOKEN: ${{ github.token }}

      # build.yml takes over from here (dispatched above); it is the only
      # writer of the GitHub Release (binaries, SHA256SUMS, npm publish).
